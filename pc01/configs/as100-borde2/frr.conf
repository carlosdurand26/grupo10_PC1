frr version 10.7.1
frr defaults traditional
hostname as100-borde2
log syslog informational
!
interface eth1
 ip address 181.0.1.1/30
 ipv6 address fd12:100:200:3::0/127
exit
!
interface eth2
 ip address 181.0.0.1/30
 ipv6 address fd12:100:200:4::0/127
exit
!
interface eth3
 ip address 10.0.0.58/30
 ip ospf network point-to-point
 ip ospf prefix-suppression
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
exit
!
interface lo
 ip address 200.1.1.2/32
 ip ospf passive
 ipv6 address 2001:1:1::2/128
 ipv6 ospf6 area 0
 ipv6 ospf6 network point-to-point
 ip address 10.100.100.2/32
 ipv6 address fd10:100:100::2/128
exit
!
router bgp 100
 bgp router-id 200.1.1.2
 no bgp default ipv4-unicast
 neighbor 172.16.3.1 remote-as 100
 neighbor 172.16.3.1 update-source lo
 neighbor 172.16.3.2 remote-as 100
 neighbor 172.16.3.2 update-source lo
 neighbor fc10:16:3::1 remote-as 100
 neighbor fc10:16:3::1 update-source lo
 neighbor fc10:16:3::2 remote-as 100
 neighbor fc10:16:3::2 update-source lo
 neighbor 181.0.1.2 remote-as 200
 neighbor 181.0.1.2 description eBGP-IPv4-enlace-3
 neighbor fd12:100:200:3::1 remote-as 200
 neighbor fd12:100:200:3::1 description eBGP-IPv6-enlace-3
 neighbor 181.0.0.2 remote-as 200
 neighbor 181.0.0.2 description eBGP-IPv4-enlace-4
 neighbor fd12:100:200:4::1 remote-as 200
 neighbor fd12:100:200:4::1 description eBGP-IPv6-enlace-4
 !
 address-family ipv4 unicast
  neighbor 172.16.3.1 activate
  neighbor 172.16.3.2 activate
  neighbor 181.0.1.2 activate
  neighbor 181.0.1.2 prefix-list PC1-V4-IN in
  neighbor 181.0.1.2 prefix-list PC1-V4-OUT out
  neighbor 181.0.0.2 activate
  neighbor 181.0.0.2 prefix-list PC1-V4-IN in
  neighbor 181.0.0.2 prefix-list PC1-V4-OUT out
  neighbor 172.16.3.1 next-hop-self
  neighbor 172.16.3.2 next-hop-self
  network 10.100.100.2/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fc10:16:3::1 activate
  neighbor fc10:16:3::2 activate
  neighbor fd12:100:200:3::1 activate
  neighbor fd12:100:200:3::1 prefix-list PC1-V6-IN in
  neighbor fd12:100:200:3::1 prefix-list PC1-V6-OUT out
  neighbor fd12:100:200:4::1 activate
  neighbor fd12:100:200:4::1 prefix-list PC1-V6-IN in
  neighbor fd12:100:200:4::1 prefix-list PC1-V6-OUT out
  neighbor fc10:16:3::1 next-hop-self
  neighbor fc10:16:3::2 next-hop-self
  network fd10:100:100::2/128
 exit-address-family
exit
!
router ospf
 network 10.0.0.56/30 area 0
 network 200.1.1.2/32 area 0
exit
!
router ospf6
 ospf6 router-id 200.1.1.2
exit
!

ip prefix-list PC1-V4-OUT seq 10 permit 10.100.100.2/32
ipv6 prefix-list PC1-V6-OUT seq 10 permit fd10:100:100::2/128
ip prefix-list PC1-V4-IN seq 10 permit 10.200.100.1/32
ipv6 prefix-list PC1-V6-IN seq 10 permit fd20:200:100::1/128
ip prefix-list PC1-V4-IN seq 20 permit 10.200.100.2/32
ipv6 prefix-list PC1-V6-IN seq 20 permit fd20:200:100::2/128
!
ip prefix-list PC1-V4-OUT seq 40 permit 198.51.100.0/30
ipv6 prefix-list PC1-V6-OUT seq 40 permit 2001:db8:100:50::/64
ip prefix-list PC1-V4-IN seq 40 permit 10.200.50.0/30
ipv6 prefix-list PC1-V6-IN seq 40 permit fd20:200:50::/127
