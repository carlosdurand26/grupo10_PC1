frr version 10.7.1
frr defaults traditional
hostname as200-borde1
log syslog informational
!
interface eth1
 ip address 161.0.0.2/30
 ipv6 address fd12:100:200:1::1/127
exit
!
interface eth2
 ip address 181.0.1.2/30
 ipv6 address fd12:100:200:3::1/127
exit
!
interface eth3
 ip address 10.200.0.62/30
 ipv6 address fd20:200:0:f::1/64
 ip router isis ISP200
 ipv6 router isis ISP200
 isis network point-to-point
exit
!
interface lo
 ip address 190.1.1.1/32
 ipv6 address 2006:1:1::1/128
 ip router isis ISP200
 ipv6 router isis ISP200
 isis passive
 ip address 10.200.100.1/32
 ipv6 address fd20:200:100::1/128
exit
!
router bgp 200
 bgp router-id 190.1.1.1
 no bgp default ipv4-unicast
 neighbor 10.200.3.1 remote-as 200
 neighbor 10.200.3.1 description iBGP-as200-rr1
 neighbor 10.200.3.1 update-source lo
 neighbor 10.200.3.2 remote-as 200
 neighbor 10.200.3.2 description iBGP-as200-rr2
 neighbor 10.200.3.2 update-source lo
 neighbor fd20:200:3::1 remote-as 200
 neighbor fd20:200:3::1 description iBGP6-as200-rr1
 neighbor fd20:200:3::1 update-source lo
 neighbor fd20:200:3::2 remote-as 200
 neighbor fd20:200:3::2 description iBGP6-as200-rr2
 neighbor fd20:200:3::2 update-source lo
 neighbor 161.0.0.1 remote-as 100
 neighbor 161.0.0.1 description eBGP-IPv4-enlace-1
 neighbor fd12:100:200:1::0 remote-as 100
 neighbor fd12:100:200:1::0 description eBGP-IPv6-enlace-1
 neighbor 181.0.1.1 remote-as 100
 neighbor 181.0.1.1 description eBGP-IPv4-enlace-3
 neighbor fd12:100:200:3::0 remote-as 100
 neighbor fd12:100:200:3::0 description eBGP-IPv6-enlace-3
 !
 address-family ipv4 unicast
  neighbor 10.200.3.1 activate
  neighbor 10.200.3.2 activate
  neighbor 161.0.0.1 activate
  neighbor 161.0.0.1 prefix-list PC1-V4-IN in
  neighbor 161.0.0.1 prefix-list PC1-V4-OUT out
  neighbor 181.0.1.1 activate
  neighbor 181.0.1.1 prefix-list PC1-V4-IN in
  neighbor 181.0.1.1 prefix-list PC1-V4-OUT out
  neighbor 10.200.3.1 next-hop-self
  neighbor 10.200.3.2 next-hop-self
  network 10.200.100.1/32
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd20:200:3::1 activate
  neighbor fd20:200:3::2 activate
  neighbor fd12:100:200:1::0 activate
  neighbor fd12:100:200:1::0 prefix-list PC1-V6-IN in
  neighbor fd12:100:200:1::0 prefix-list PC1-V6-OUT out
  neighbor fd12:100:200:3::0 activate
  neighbor fd12:100:200:3::0 prefix-list PC1-V6-IN in
  neighbor fd12:100:200:3::0 prefix-list PC1-V6-OUT out
  neighbor fd20:200:3::1 next-hop-self
  neighbor fd20:200:3::2 next-hop-self
  network fd20:200:100::1/128
 exit-address-family
exit
!
router isis ISP200
 net 49.0200.0000.0000.0010.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
exit
!

ip prefix-list PC1-V4-OUT seq 10 permit 10.200.100.1/32
ipv6 prefix-list PC1-V6-OUT seq 10 permit fd20:200:100::1/128
ip prefix-list PC1-V4-IN seq 10 permit 10.100.100.1/32
ipv6 prefix-list PC1-V6-IN seq 10 permit fd10:100:100::1/128
ip prefix-list PC1-V4-IN seq 20 permit 10.100.100.2/32
ipv6 prefix-list PC1-V6-IN seq 20 permit fd10:100:100::2/128
!
ip prefix-list PC1-V4-IN seq 40 permit 198.51.100.0/30
ipv6 prefix-list PC1-V6-IN seq 40 permit 2001:db8:100:50::/64
ip prefix-list PC1-V4-OUT seq 40 permit 10.200.50.0/30
ipv6 prefix-list PC1-V6-OUT seq 40 permit fd20:200:50::/127
