frr defaults traditional
hostname cpe-isp2
service integrated-vtysh-config
!
interface eth1
 description WAN hacia as200-pe1
 ip address 10.200.50.2/30
 ipv6 address fd20:200:50::1/127
exit
!
interface eth2
 description LAN empresarial compartida; VRRP pendiente
 ip address 192.168.50.3/24
 ipv6 address fd50:50::3/64
exit
!
ip route 0.0.0.0/0 10.200.50.1
ipv6 route ::/0 fd20:200:50::
!
line vty
!
