frr defaults traditional
hostname cpe-isp1
service integrated-vtysh-config
!
interface eth1
 description WAN hacia as100-pe1
 ip address 10.100.50.2/30
 ipv6 address fd10:100:50::1/127
exit
!
interface eth2
 description LAN empresarial - VRRPv3
 ip address 192.168.50.2/24
 ipv6 address fd50:50::2/64
 vrrp 50 version 3
 vrrp 50 priority 200
 vrrp 50 advertisement-interval 1000
 vrrp 50 ip 192.168.50.1
 vrrp 50 ipv6 fd50:50::1
exit
!
ip route 0.0.0.0/0 10.100.50.1
ipv6 route ::/0 fd10:100:50::
!
line vty
!
