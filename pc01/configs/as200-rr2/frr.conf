frr version 10.7.1
frr defaults traditional
hostname as200-rr2
log syslog informational
!
interface eth1
 ip address 10.200.0.34/30
 ipv6 address fd20:200:0:9::1/64
 ip router isis ISP200
 ipv6 router isis ISP200
 isis network point-to-point
exit
!
interface eth2
 ip address 10.200.0.37/30
 ipv6 address fd20:200:0:a::1/64
 ip router isis ISP200
 ipv6 router isis ISP200
 isis network point-to-point
exit
!
interface lo
 ip address 10.200.3.2/32
 ipv6 address fd20:200:3::2/128
 ip router isis ISP200
 ipv6 router isis ISP200
 isis passive
exit
!
router isis ISP200
 net 49.0200.0000.0000.0007.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
exit
!
