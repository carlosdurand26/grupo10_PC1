frr version 10.7.1
frr defaults traditional
hostname as200-borde1
log syslog informational
!
interface eth1
 ip address 161.0.0.2/30
exit
!
interface eth2
 ip address 181.0.1.2/30
exit
!
interface eth3
 ip address 10.200.0.62/30
 ipv6 address fd20:200:0:f::1/64
 ip router isis ISP200
 ipv6 router isis ISP200
 isis network point-to-point
exit
!
interface lo
 ip address 190.1.1.1/32
 ipv6 address 2006:1:1::1/128
 ip router isis ISP200
 ipv6 router isis ISP200
 isis passive
exit
!
router bgp 200
 bgp router-id 190.1.1.1
 no bgp default ipv4-unicast
 neighbor 10.200.3.1 remote-as 200
 neighbor 10.200.3.1 description iBGP-as200-rr1
 neighbor 10.200.3.1 update-source lo
 neighbor 10.200.3.2 remote-as 200
 neighbor 10.200.3.2 description iBGP-as200-rr2
 neighbor 10.200.3.2 update-source lo
 neighbor fd20:200:3::1 remote-as 200
 neighbor fd20:200:3::1 description iBGP6-as200-rr1
 neighbor fd20:200:3::1 update-source lo
 neighbor fd20:200:3::2 remote-as 200
 neighbor fd20:200:3::2 description iBGP6-as200-rr2
 neighbor fd20:200:3::2 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.200.3.1 activate
  neighbor 10.200.3.2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd20:200:3::1 activate
  neighbor fd20:200:3::2 activate
 exit-address-family
exit
!
router isis ISP200
 net 49.0200.0000.0000.0010.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
exit
!
